name: 🏗️ Infrastructure Cloud Verification
on:
  pull_request:
    paths: ["packages/deploy-terraform/**"]

jobs:
  terraform-plan:
    runs-on: ubuntu-latest
    steps:
      - name: 🔑 Checkout Source Code
        uses: actions/checkout@v4

      - name: 🛠️ Set up Node and Yarn Workspace
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "yarn"

      - name: 📦 Install Workspace Dependencies
        run: yarn install --immutable

      - name: 📡 Run Infrastructure Plan Matrix
        run: yarn tf:plan
        env:
          TF_VAR_database_secure_password: ${{ secrets.AWS_PROD_DB_PASSWORD }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
