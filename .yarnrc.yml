# Strict supply-chain security: Block all direct Git dependencies (e.g., git+https://).
# All dependencies must be pulled securely from an official npm registry package.
approvedGitRepositories: []

# Allow open-source contributors to use a shared global system cache to dramatically
# speed up their local `yarn install` times on their own machines.
enableGlobalCache: true

# Compliance: SOC 2 Type II Configuration & Build Integrity.
# Force Yarn to cross-examine and re-query remote registries during installation
# to validate that the lockfile content cryptographically matches remote checksums.
enableHardenedMode: true

# Set this to false locally so Yarn can fetch missing packages into your cache.
# Enforce true on production CI pipelines using the 'yarn install --immutable-cache' flag instead.
enableImmutableCache: false

# Disable third-party lifecycle scripts (preinstall, install, postinstall) by default
# for security. Explicitly allow-list trusted packages in your package.json like this:
#
# "dependenciesMeta": {
#   "esbuild": {
#     "built": true
#   }
# }
enableScripts: false

# Suppress noisy peer dependency warnings from terminal output during package resolution.
logFilters:
  # Ignore missing peer dependency warnings.
  - code: YN0002
    level: discard
  # Ignore peer dependency version mismatch warnings.
  - code: YN0060
    level: discard
  # Hide the "Cache entry required but missing" information alerts
  - code: YN0056
    level: discard
  # Silence Yarn's trailing Call-To-Action reminder to debug peer dependencies.
  - code: YN0086
    level: discard

# Force a traditional, flat node_modules directory instead of Plug'n'Play (PnP).
nodeLinker: node-modules

# Prevent installing packages published less than 3 days ago to guard against typosquatting.
npmMinimalAgeGate: 0

# Compliance: Supply-Chain Operations.
# Bypass the 3-day age gate exclusively for our vetted organization scope.
npmPreapprovedPackages:
  - "@ai-crew-suite/*"

# Compliance: FINRA / SOC 2 Network Perimeter Controls.
# Ensure all package lookups target official secure channels.
npmRegistryServer: "https://registry.npmjs.org"
npmAlwaysAuth: false

# ====================================================================================
# 🩹 DEPENDENCY PATH COERCION & COMPATIBILITY LAYER
# ====================================================================================
# Compliance & Integrity: Supply-Chain Stability.
# Overrides and injects missing downstream package definitions required by legacy or
# loosely typed framework ecosystems (e.g., Backstage core modules). This prevents
# silent compilation crashes and resolution leaks by explicitly binding phantom
# dependencies to exact topological nodes without altering upstream open-source code.
packageExtensions:
  "@backstage/cli-module-build@*":
    dependencies:
      esbuild: "catalog:dev"

  "@backstage/cli-module-test-jest@*":
    dependencies:
      "@jest/environment-jsdom-abstract": "*"
      jest-environment-node: "*"
      jest-runtime: "*"
      jsdom: "*"
      yaml: "*"

  "@backstage/plugin-app@*":
    dependencies:
      "@backstage/config": "catalog:prod"
      "@backstage/core-app-api": "catalog:prod"
      i18next: "catalog:prod"
      lodash: "catalog:prod"
      prop-types: "catalog:prod"
      use-sync-external-store: "catalog:prod"

  "@backstage/plugin-catalog-react@*":
    dependencies:
      "@emotion/react": "catalog:prod"
      "@emotion/styled": "catalog:prod"
      "@mui/material": "catalog:prod"

  "@backstage/plugin-permission-react@*":
    dependencies:
      react-router: "catalog:prod"
      react-router-dom: "catalog:prod"

  vitest@*:
    dependencies:
      "@types/node": "*"

# Inject our custom Yarn platform plugins.
# Remote example for external consumer repositories:
# spec: "https://githubusercontent.com"
#plugins:
#  - path: .yarn/plugins/yarn-block-add.cjs
#    spec: ./.yarn/plugins/yarn-block-add.cjs
#  - checksum: ae08ece83681cc6d217ebb53d9e00a06ea215383f34af0681a05da5720e018a6b0d98012112f9368e9fe2328b19919baba37ada25f46c4614b894765a9338db9
#    path: .yarn/plugins/@yarnpkg/plugin-backstage.cjs
#    spec: "https://versions.backstage.io/v1/releases/1.53.1/yarn-plugin"

# Compliance: HIPAA / SOC 2 Data in Transit Encryption.
# Block all unencrypted HTTP traffic. Force HTTPS exclusively for all registries.
unsafeHttpWhitelist: []

# Execute our custom, decorated Yarn binary instead of relying on Node's Corepack.
yarnPath: .yarn/releases/yarn-4.18.0.cjs

# ------------------------------------------------------------------------------------
# 📋 CENTRAL VERSION MANAGEMENT (YARN CATALOGS)
# ------------------------------------------------------------------------------------

# Maintain package versions here and use catalog references in package.json
# for central management of dependency versions across monorepo packages and
# project repos.
catalogs:
  # Production runtime dependencies.
  prod:
    "@backstage/backend-common": "^0.25.0"
    "@backstage/backend-defaults": "^0.18.0"
    "@backstage/config": "^1.3.8"
    "@backstage/core-app-api": "^1.20.2"
    "@backstage/plugin-app-backend": "^0.3.76"
    "@backstage/plugin-auth-backend": "^0.22.8"
    "@backstage/plugin-auth-backend-module-github-provider": "^0.1.19"
    "@backstage/plugin-catalog-backend": "^1.26.0"
    "@backstage/plugin-proxy-backend": "^0.5.2"
    "@backstage/plugin-scaffolder-backend": "^1.26.0"
    "@backstage/plugin-techdocs-backend": "^1.10.9"
    "express": "^4.21.0"
    "express-promise-router": "^4.1.1"
    "msw": "^2.15.0"
    "react-dom": "^18.3.1"
    "react-router-dom": "^6.30.6"
    "react-router": "^6.30.6"
    "react": "^18.3.1"
    "winston": "^3.15.0"

  # Local dev, tooling, and compilation dependencies.
  dev:
    "@backstage/cli": "^0.29.1"
    "@tsconfig/node22": "^22.0.6"
    "@types/node": "^22.20.4"
    "prettier": "^3.9.0"
    "turbo": "^2.11.4"
    "typescript": "^6.0.3"
