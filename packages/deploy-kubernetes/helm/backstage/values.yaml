# ====================================================================================
# ⚓ DEFAULT DEVELOPMENT VALUE SCHEMAS
# ====================================================================================

global:
  environment: development
  domain: localhost

backstage:
  replicaCount: 1
  image:
    repository: ai-crew-suite/backstage
    tag: latest
    pullPolicy: IfNotPresent
  resources:
    limits:
      cpu: "500m"
      memory: 1Gi
    requests:
      cpu: "250m"
      memory: 512Mi
  envFromSecret: "crew-local-backend-secrets"
