apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-server
  labels:
    app: backstage
    environment: {{ .Values.global.environment }}
spec:
  replicas: {{ .Values.backstage.replicaCount }}
  selector:
    matchLabels:
      app: backstage
  template:
    metadata:
      labels:
        app: backstage
    spec:
      containers:
        - name: backstage-node
          image: "{{ .Values.backstage.image.repository }}:{{ .Values.backstage.image.tag }}"
          imagePullPolicy: {{ .Values.backstage.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 7007
              protocol: TCP

          # Injected runtime production configs
          envFrom:
            - secretRef:
                name: {{ .Values.backstage.envFromSecret }}

          # 🛡️ SOC 2 Security Health Checking Guardrails
          livenessProbe:
            httpGet:
              path: /health
              port: 7007
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: 7007
            initialDelaySeconds: 15
            periodSeconds: 5

          resources:
            {{- toYaml .Values.backstage.resources | nindent 12 }}
