# ====================================================================================
# 🛡️ UNIFIED COMPLIANCE CONFIGURATION LAYER (ADAPTIVE SANDBOX PROFILE)
# Frameworks: SOC 2 Type II System Isolation | Variable-Driven Workstation Freedom
# ====================================================================================

app:
  title: AI Crew Suite Platform
  baseUrl: ${APP_BASE_URL:-http://localhost}:${APP_PORT:-7007}

organization:
  name: AI Crew Suite

backend:
  baseUrl: ${APP_BASE_URL:-http://localhost}:${APP_PORT:-7007}

  listen:
    port: 7007

  cors:
    origin: ${APP_BASE_URL:-http://localhost}:${APP_PORT:-7007}
    methods: [GET, POST, PUT, DELETE]
    allowedHeaders: [Content-Type, Authorization]
    credentials: true

  database:
    client: pg
    connection:
      host: ${DB_HOST:-localhost}
      port: ${DB_PORT:-5433}
      user: ${DB_USER:-backstage}
      password: ${DB_PASSWORD:-backstage}
      database: ${DB_NAME:-backstage_plugin_catalog}
    plugin:
      scaffolder:
        client: pg
        connection:
          database: ${DB_SCAFFOLDER_NAME:-backstage_plugin_scaffolder}
      auth:
        client: pg
        connection:
          database: ${DB_AUTH_NAME:-backstage_plugin_auth}

  # 🔒 Strict Network Sandbox: Enforces absolute dark-site testing within the AWS VPC
  reading:
    allow:
      - host: ${ALLOWED_HOST:-localhost}

# ====================================================================================
# 🛡️ CI STAGING/TESTING CONFIGURATION BLUEPRINT (AIR-GAPPED ENVIRONMENT)
# ====================================================================================

# 1. Bypassing External Git Provider APIs: Consume static data fixtures and local mock repositories
catalog:
  rules:
    - allow: [
        API,
        ArchitectureDecision,
        Component,
        DataProduct,
        Domain,
        Group,
        Location,
        Model,
        Product,
        Resource,
        System,
        Template,
        User,
        Vulnerability,
      ]
  locations:
    # Loads the index, which auto-scans everything else
    - type: file
      target: ${MOCK_FIXTURES_PATH:-../../mock-fixtures}/location.yaml
    # Plugin workspace injection variables kept active and optional
    - type: file
      target: ${EXTRA_MOCK_LOCATION:-${MOCK_FIXTURES_PATH:-../../mock-fixtures}/catalog/location.yaml}

# 2. Bypassing External Storage & DinD Privilege Requirements
techdocs:
  builder: 'local'
  generator:
    runIn: 'local' # Safe: Prevents dangerous Docker-in-Docker container requirements in EKS
  publisher:
    type: 'local'
    local:
      # Maps straight to the pre-compiled HTML fragments copied into your production Docker image
      publishDir: ${MOCK_FIXTURES_PATH:-../../mock-fixtures}/techdocs

# 3. Automated Scaffolder Invariant Concurrency Constraints
scaffolder:
  concurrentTasks: 5

# 4. Intercepting Third-Party Drivers: Route traffic cleanly to the WireMock container mesh network
drivers:
  pagerduty:
    # Routes securely across the internal EKS cluster network to your WireMock pod daemon
    baseUrl: ${MOCK_PROXY_URL:-http://localhost:8080}
    apiToken: mock-token-compliance-override
  datadog:
    baseUrl: ${MOCK_PROXY_URL:-http://localhost:8080}
    apiKey: mock-fixturesdog-key
    applicationKey: mock-fixturesdog-app-key
